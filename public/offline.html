<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vuma — Offline</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #F7F5F0;
    color: #0E1B2E;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    text-align: center;
    padding: 32px;
  }
  .badge {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: #0E1B2E;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    color: #F2A93B;
    margin-bottom: 20px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #5B6B85; font-size: 14px; max-width: 320px; line-height: 1.5; margin: 0 0 24px; }
  button {
    background: #F2A93B;
    color: #0E1B2E;
    border: none;
    border-radius: 12px;
    padding: 12px 24px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="badge">V</div>
  <h1>No connection right now</h1>
  <p>Vuma needs an internet connection to load for the first time. Once you're back online, this will reload automatically — or tap below to try again.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
